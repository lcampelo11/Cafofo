<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cafofo</title>
<meta name="description" content="Cafofo - Central Multi-Ecossistema de Inteligência Artificial.">
<meta property="og:title" content="Cafofo">
<meta property="og:description" content="Cafofo - Central Multi-Ecossistema de Inteligência Artificial.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#050506">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="fundo" aria-hidden="true">
  <svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <filter id="g" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
      <path id="p1" d="M-10 150 H95 Q112 150 125 137 L215 47 Q226 36 242 36 H410"/>
      <path id="p2" d="M-10 330 H40 Q55 330 66 319 L110 275"/>
      <path id="p3" d="M205 430 L330 305 Q345 290 365 290 H410"/>
      <path id="p4" d="M150 810 L480 480"/>
      <path id="p5" d="M250 810 L580 480"/>
    </defs>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g filter="url(#g)" stroke="#ff2433" stroke-width="3.5" opacity=".85">
        <use href="#p1"/><use href="#p2"/><use href="#p3"/><use href="#p4"/><use href="#p5"/>
      </g>
      <g stroke="#ff5a64" stroke-width="1" opacity=".95">
        <use href="#p1"/><use href="#p2"/><use href="#p3"/><use href="#p4"/><use href="#p5"/>
      </g>
    </g>
  </svg>
  <div class="pontos a"></div>
  <div class="pontos b"></div>
</div>

<button id="btnMenu" class="menu-btn" type="button" aria-label="Abrir menu de ecossistemas" aria-expanded="false" aria-controls="drawer">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M4 7H20M4 12H20M4 17H20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </svg>
</button>

<div id="drawerOverlay" class="drawer-overlay" aria-hidden="true"></div>
<aside id="drawer" class="drawer" aria-label="Seletor de ecossistemas" aria-hidden="true">
  <div class="drawer-topo">
    <span class="drawer-titulo"><i>//</i> Ecossistemas</span>
    <button id="btnFecharMenu" class="drawer-fechar" type="button" aria-label="Fechar menu">×</button>
  </div>
  <nav id="listaEcossistemas" class="drawer-lista" aria-label="Ecossistemas de IA"></nav>
  <div class="drawer-rodape">
    <small id="drawerChatInfo"></small>
  </div>
</aside>

<header>
  <button id="btnVoltar" type="button" hidden>← Voltar</button>
  <div class="marca">
    <img src="logo-aco.jpg" alt="Cafofo" onerror="this.hidden=true;this.nextElementSibling.hidden=false">
    <span class="nome" hidden>CAFOFO</span>
  </div>
  <button id="ecoBadge" class="eco-badge" type="button" aria-label="Trocar ecossistema">
    <span class="eco-dot" aria-hidden="true"></span>
    <span id="ecoBadgeNome">Google</span>
  </button>
</header>

<main>
  <section id="home">
    <form id="form" class="entrada">
      <textarea id="texto" rows="1" placeholder="Ex.: colocar um aquário nessa sala"></textarea>
      <div class="row">
        <label class="anexo"><span class="seta">↗</span> Foto ou PDF<input type="file" id="arquivo" accept="image/*,application/pdf" hidden></label>
        <span id="nomeArq"></span>
        <button class="go" type="submit">IR →</button>
      </div>
    </form>

    <h2><span><i>//</i> Ou escolha o que quer fazer</span><small id="modulos"></small></h2>
    <div class="grid" id="grid"></div>

    <h2><span><i>//</i> Atalhos</span></h2>
    <div class="links">
      <a class="btn sec" id="btnDrive" href="https://drive.google.com" target="_blank" rel="noopener noreferrer">🗂️ Minhas imagens (Drive)</a>
      <a class="btn sec" href="teste.html" target="_blank" rel="noopener noreferrer">🧪 Página de teste</a>
    </div>
  </section>

  <section id="resultado" hidden></section>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
