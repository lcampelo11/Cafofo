<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cafofo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#111111">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="btnVoltar" hidden>← Voltar</button>
  <img class="logo" src="logo.png" alt="Cafofo" onload="this.nextElementSibling.style.display='none'" onerror="this.style.display='none'">
  <span class="nome">Cafofo</span>
</header>

<main>
  <section id="home">
    <form id="form">
      <textarea id="texto" rows="3" placeholder="O que você quer fazer? Ex: colocar um aquário nessa sala"></textarea>
      <div class="row">
        <label class="anexo">📎 Foto ou PDF<input type="file" id="arquivo" accept="image/*,application/pdf" hidden></label>
        <span id="nomeArq"></span>
        <button class="go" type="submit">Ir</button>
      </div>
    </form>

    <h2>Ou escolha o que quer fazer</h2>
    <div class="grid" id="grid"></div>

    <h2>Atalhos</h2>
    <div class="links">
      <button class="btn sec" id="btnDrive">🗂️ Minhas imagens (Drive)</button>
      <a class="btn sec" href="teste.html">🧪 Página de teste</a>
    </div>
  </section>

  <section id="resultado" hidden></section>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
